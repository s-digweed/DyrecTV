name: Grab OSN EPG (every 3 days)

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  grab-osn:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone epg grabber
        run: git clone --depth 1 https://github.com/iptv-org/epg.git epg-src

      - name: Install dependencies
        run: cd epg-src && npm install

      - name: Parse OSN EN channels
        run: |
          cd epg-src
          npm run channels:parse -- --config=./sites/osn.com/osn.com.config.js \
            --output=./sites/osn.com/osn.com_en.channels.xml \
            --set=lang:en
        continue-on-error: true

      - name: Grab OSN EN guide
        run: cd epg-src && npm run grab -- --sites=osn.com --lang=en --output=OSN_EN.xml --days=5
        continue-on-error: true

      - name: Move OSN EN
        run: |
          if [ -f epg-src/OSN_EN.xml ]; then
            gzip -f epg-src/OSN_EN.xml
            cp epg-src/OSN_EN.xml.gz OSN_EN.xml.gz
          else
            echo "OSN_EN.xml not generated"
          fi

      - name: Parse OSN AR channels
        run: |
          cd epg-src
          npm run channels:parse -- --config=./sites/osn.com/osn.com.config.js \
            --output=./sites/osn.com/osn.com_ar.channels.xml \
            --set=lang:ar
        continue-on-error: true

      - name: Grab OSN AR guide
        run: cd epg-src && npm run grab -- --sites=osn.com --lang=ar --output=OSN_AR.xml --days=5
        continue-on-error: true

      - name: Move OSN AR
        run: |
          if [ -f epg-src/OSN_AR.xml ]; then
            gzip -f epg-src/OSN_AR.xml
            cp epg-src/OSN_AR.xml.gz OSN_AR.xml.gz
          else
            echo "OSN_AR.xml not generated"
          fi

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add OSN_EN.xml.gz OSN_AR.xml.gz
          git commit -m "Update OSN EPG" || echo "No changes"
          git push
