name: Grab OSN EPG (every 3 days)

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  grab-osn:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone epg grabber
        run: git clone --depth 1 https://github.com/iptv-org/epg.git epg-src

      - name: Install dependencies
        run: cd epg-src && npm install

      - name: Copy Legacy config
        run: cp osn_legacy.config.js epg-src/sites/osn.com/osn_legacy.config.js

      - name: Copy custom EN channels file
        run: cp osn_legacy_en.channels.xml epg-src/sites/osn.com/osn_legacy_en.channels.xml

      - name: Copy custom AR channels file
        run: cp osn_legacy_ar.channels.xml epg-src/sites/osn.com/osn_legacy_ar.channels.xml

      # ── OSN Android English ───────────────────────────────
      - name: Parse OSN Android EN channels
        run: |
          cd epg-src
          npm run channels:parse -- --config=./sites/osn.com/osn.com.config.js \
            --output=./sites/osn.com/osn.com_en.channels.xml \
            --set=lang:en
        continue-on-error: true

      - name: Grab OSN Android EN guide
        run: |
          cd epg-src
          npm run grab -- --channels=./sites/osn.com/osn.com_en.channels.xml \
            --output=OSN_ANDROID_EN.xml --days=5
        continue-on-error: true

      # ── OSN Android Arabic ────────────────────────────────
      - name: Parse OSN Android AR channels
        run: |
          cd epg-src
          npm run channels:parse -- --config=./sites/osn.com/osn.com.config.js \
            --output=./sites/osn.com/osn.com_ar.channels.xml \
            --set=lang:ar
        continue-on-error: true

      - name: Grab OSN Android AR guide
        run: |
          cd epg-src
          npm run grab -- --channels=./sites/osn.com/osn.com_ar.channels.xml \
            --output=OSN_ANDROID_AR.xml --days=5
        continue-on-error: true

      # ── OSN Legacy English (extra channels) ───────────────
      - name: Grab OSN Legacy EN guide
        run: |
          cd epg-src
          npm run grab -- --channels=./sites/osn.com/osn_legacy_en.channels.xml \
            --output=OSN_LEGACY_EN.xml --days=5
        continue-on-error: true

      # ── OSN Legacy Arabic (extra channels) ────────────────
      - name: Grab OSN Legacy AR guide
        run: |
          cd epg-src
          npm run grab -- --channels=./sites/osn.com/osn_legacy_ar.channels.xml \
            --output=OSN_LEGACY_AR.xml --days=5
        continue-on-error: true

      # ── Merge Android + Legacy into final EN/AR files ─────
      - name: Merge EN files
        run: |
          python3 -c "
import xml.etree.ElementTree as ET
import os, shutil
android = 'epg-src/OSN_ANDROID_EN.xml'
legacy = 'epg-src/OSN_LEGACY_EN.xml'
output = 'epg-src/OSN_EN.xml'
if os.path.exists(android) and os.path.exists(legacy):
    base = ET.parse(android).getroot()
    extra = ET.parse(legacy).getroot()
    [base.append(e) for e in extra]
    ET.ElementTree(base).write(output, encoding='UTF-8', xml_declaration=True)
elif os.path.exists(android):
    shutil.copy(android, output)
elif os.path.exists(legacy):
    shutil.copy(legacy, output)
"

      - name: Merge AR files
        run: |
          python3 -c "
import xml.etree.ElementTree as ET
import os, shutil
android = 'epg-src/OSN_ANDROID_AR.xml'
legacy = 'epg-src/OSN_LEGACY_AR.xml'
output = 'epg-src/OSN_AR.xml'
if os.path.exists(android) and os.path.exists(legacy):
    base = ET.parse(android).getroot()
    extra = ET.parse(legacy).getroot()
    [base.append(e) for e in extra]
    ET.ElementTree(base).write(output, encoding='UTF-8', xml_declaration=True)
elif os.path.exists(android):
    shutil.copy(android, output)
elif os.path.exists(legacy):
    shutil.copy(legacy, output)
"

      # ── Gzip and commit ───────────────────────────────────
      - name: Gzip EN
        run: |
          if [ -f epg-src/OSN_EN.xml ]; then
            gzip -f epg-src/OSN_EN.xml
            cp epg-src/OSN_EN.xml.gz OSN_EN.xml.gz
          fi

      - name: Gzip AR
        run: |
          if [ -f epg-src/OSN_AR.xml ]; then
            gzip -f epg-src/OSN_AR.xml
            cp epg-src/OSN_AR.xml.gz OSN_AR.xml.gz
          fi

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add OSN_EN.xml.gz OSN_AR.xml.gz
          git commit -m "Update OSN EPG" || echo "No changes"
          git push
