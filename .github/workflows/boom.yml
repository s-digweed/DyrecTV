name: Normalize Jpuffle5 Boomerang + CN Classic + Animax

# Runs whenever boom.sh pushes the day's "Jpuffle5 Boomerang.xml":
# fixes titles, adds (Year) to films, adds IMDb descriptions (OMDb, then TMDB).
# The commit below uses GITHUB_TOKEN, so it does not trigger this workflow again.
# CN Classic descriptions are filled in over a few days (OMDb free key = ~1,000
# calls/day), so it also runs once a day; cached titles cost nothing.
on:
  push:
    paths:
      - "Jpuffle5 Boomerang.xml"
      - "CNClassic.xml"
      - "animax_na.xml"
      - "boom_enrich.py"
  schedule:
    - cron: "17 1 * * *"          # 04:17 KSA
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: boom-enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize titles + add descriptions
        env:
          OMDB_API_KEY2: ${{ secrets.OMDB_API_KEY2 }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
        run: |
          pip install -q requests
          python3 -u boom_enrich.py "Jpuffle5 Boomerang.xml"
          BOOM_OMDB_BUDGET=250 python3 -u boom_enrich.py CNClassic.xml
          BOOM_OMDB_BUDGET=150 python3 -u boom_enrich.py animax_na.xml

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Jpuffle5 Boomerang.xml" CNClassic.xml animax_na.xml boom_desc_cache.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Jpuffle5 + CN Classic + Animax: titles + descriptions [skip ci]"
            git pull --rebase origin main
            git push
          fi
