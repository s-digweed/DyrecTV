name: Normalize Jpuffle5 Boomerang

# Runs whenever boom.sh pushes the day's "Jpuffle5 Boomerang.xml":
# fixes titles, adds (Year) to films, adds IMDb descriptions (OMDb, then TMDB).
# The commit below uses GITHUB_TOKEN, so it does not trigger this workflow again.
on:
  push:
    paths:
      - "Jpuffle5 Boomerang.xml"
      - "boom_enrich.py"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: boom-enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize titles + add descriptions
        env:
          OMDB_API_KEY2: ${{ secrets.OMDB_API_KEY2 }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          pip install -q requests
          python3 -u boom_enrich.py "Jpuffle5 Boomerang.xml"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Jpuffle5 Boomerang.xml" boom_desc_cache.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Jpuffle5: titles + descriptions [skip ci]"
            git pull --rebase origin main
            git push
          fi
