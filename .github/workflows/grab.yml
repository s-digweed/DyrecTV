name: Grab DirecTV + ART + Toonami + beIN EPG

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  grab:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone epg grabber
        run: git clone --depth 1 https://github.com/iptv-org/epg.git epg-src

      - name: Install dependencies
        run: cd epg-src && npm install

      # ── DirecTV ──────────────────────────────────────────
      - name: Copy DirecTV channels file
        run: cp jamie.channels.xml epg-src/jamie.channels.xml

      - name: Grab DirecTV guide
        run: cd epg-src && npm run grab -- --channels=jamie.channels.xml --output=DIRECTV.xml --days=5

      - name: Gzip and move DirecTV
        run: cd epg-src && gzip -f DIRECTV.xml && cp DIRECTV.xml.gz ../DIRECTV.xml.gz

      # ── ART ───────────────────────────────────────────────
      - name: Grab ART guide
        run: |
          cd epg-src
          npm run grab -- --sites=artonline.tv --output=ART.xml --days=7
        continue-on-error: true

      - name: Move ART
        run: |
          if [ -f epg-src/ART.xml ]; then
            gzip -f epg-src/ART.xml
            cp epg-src/ART.xml.gz ART.xml.gz
          else
            echo "ART.xml not generated"
          fi

      # ── Toonami Aftermath ─────────────────────────────────
      - name: Parse Toonami channels
        run: |
          cd epg-src
          npm run channels:parse -- \
            --config=./sites/toonamiaftermath.com/toonamiaftermath.com.config.js \
            --output=./sites/toonamiaftermath.com/toonamiaftermath.com.channels.xml
        continue-on-error: true

      - name: Grab Toonami guide
        run: |
          cd epg-src
          npm run grab -- --sites=toonamiaftermath.com --output=TOONAMIAM.xml --days=5
        continue-on-error: true

      - name: Move Toonami
        run: |
          if [ -f epg-src/TOONAMIAM.xml ]; then
            gzip -f epg-src/TOONAMIAM.xml
            cp epg-src/TOONAMIAM.xml.gz TOONAMIAM.xml.gz
          else
            echo "TOONAMIAM.xml not generated"
          fi

      # ── beIN English ──────────────────────────────────────
      - name: Parse beIN EN channels
        run: |
          cd epg-src
          npm run channels:parse -- \
            --config=./sites/bein.com/bein.com.config.js \
            --output=./sites/bein.com/bein.com_en.channels.xml \
            --set=lang:en
        continue-on-error: true

      - name: Grab beIN EN guide
        run: |
          cd epg-src
          npm run grab -- --channels=./sites/bein.com/bein.com_en.channels.xml \
            --output=BEIN_EN.xml --days=5
        continue-on-error: true

      - name: Move beIN EN
        run: |
          if [ -f epg-src/BEIN_EN.xml ]; then
            gzip -f epg-src/BEIN_EN.xml
            cp epg-src/BEIN_EN.xml.gz BEIN_EN.xml.gz
          else
            echo "BEIN_EN.xml not generated"
          fi

      # ── beIN Arabic ───────────────────────────────────────
      - name: Parse beIN AR channels
        run: |
          cd epg-src
          npm run channels:parse -- \
            --config=./sites/bein.com/bein.com.config.js \
            --output=./sites/bein.com/bein.com_ar.channels.xml \
            --set=lang:ar
        continue-on-error: true

      - name: Grab beIN AR guide
        run: |
          cd epg-src
          npm run grab -- --channels=./sites/bein.com/bein.com_ar.channels.xml \
            --output=BEIN_AR.xml --days=5
        continue-on-error: true

      - name: Move beIN AR
        run: |
          if [ -f epg-src/BEIN_AR.xml ]; then
            gzip -f epg-src/BEIN_AR.xml
            cp epg-src/BEIN_AR.xml.gz BEIN_AR.xml.gz
          else
            echo "BEIN_AR.xml not generated"
          fi


      # ── Commit all results ────────────────────────────────
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add DIRECTV.xml.gz ART.xml.gz TOONAMIAM.xml.gz BEIN_EN.xml.gz BEIN_AR.xml.gz
          git commit -m "Update EPG files" || echo "No changes"
          git pull --rebase origin main
          git push
