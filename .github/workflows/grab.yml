name: Grab DirecTV + ART + Toonami + AFN EPG

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  grab:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone epg grabber
        run: git clone --depth 1 https://github.com/iptv-org/epg.git epg-src

      - name: Install dependencies
        run: cd epg-src && npm install

      # ── DirecTV ──────────────────────────────────────────
      - name: Copy DirecTV channels file
        run: cp jamie.channels.xml epg-src/jamie.channels.xml

      - name: Grab DirecTV guide
        run: cd epg-src && npm run grab -- --channels=jamie.channels.xml --output=DIRECTV.xml --days=5

      - name: Gzip and move DirecTV
        run: cd epg-src && gzip -f DIRECTV.xml && cp DIRECTV.xml.gz ../DIRECTV.xml.gz

      # ── ART ───────────────────────────────────────────────
      - name: Grab ART guide
        run: |
          cd epg-src
          npm run grab -- --sites=artonline.tv --output=ART.xml --days=5
        continue-on-error: true

      - name: Move ART
        run: |
          if [ -f epg-src/ART.xml ]; then
            gzip -f epg-src/ART.xml
            cp epg-src/ART.xml.gz ART.xml.gz
          else
            echo "ART.xml not generated"
          fi

      # ── Toonami Aftermath ─────────────────────────────────
      - name: Parse Toonami channels
        run: |
          cd epg-src
          npm run channels:parse -- \
            --config=./sites/toonamiaftermath.com/toonamiaftermath.com.config.js \
            --output=./sites/toonamiaftermath.com/toonamiaftermath.com.channels.xml
        continue-on-error: true

      - name: Grab Toonami guide
        run: |
          cd epg-src
          npm run grab -- --sites=toonamiaftermath.com --output=TOONAMIAM.xml --days=5
        continue-on-error: true

      - name: Move Toonami
        run: |
          if [ -f epg-src/TOONAMIAM.xml ]; then
            gzip -f epg-src/TOONAMIAM.xml
            cp epg-src/TOONAMIAM.xml.gz TOONAMIAM.xml.gz
          else
            echo "TOONAMIAM.xml not generated"
          fi

      # ── AFN ───────────────────────────────────────────────
      - name: Parse AFN channels
        run: |
          cd epg-src
          npm run channels:parse -- \
            --config=./sites/v3.myafn.dodmedia.osd.mil/v3.myafn.dodmedia.osd.mil.config.js \
            --output=./sites/v3.myafn.dodmedia.osd.mil/v3.myafn.dodmedia.osd.mil.channels.xml
        continue-on-error: true

      - name: Grab AFN guide
        run: |
          cd epg-src
          npm run grab -- --sites=v3.myafn.dodmedia.osd.mil --output=AFN.xml --days=5
        continue-on-error: true

      - name: Move AFN
        run: |
          if [ -f epg-src/AFN.xml ]; then
            gzip -f epg-src/AFN.xml
            cp epg-src/AFN.xml.gz AFN.xml.gz
          else
            echo "AFN.xml not generated"
          fi

      # ── Commit all results ────────────────────────────────
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add DIRECTV.xml.gz ART.xml.gz TOONAMIAM.xml.gz AFN.xml.gz
          git commit -m "Update EPG files" || echo "No changes"
          git push
